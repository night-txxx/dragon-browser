<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Dragon - Aviso de Conexão Não Criptografada</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #18181d;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }

    .warning-card {
      max-width: 540px;
      width: 100%;
      background-color: #202027;
      border: 1px solid #3d3420;
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .icon-wrapper {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background-color: rgba(245, 166, 35, 0.15);
      color: #f5a623;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrapper svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    h1 {
      font-size: 21px;
      font-weight: 600;
      color: #f0f0f5;
      line-height: 1.3;
    }

    p.description {
      font-size: 14px;
      color: #a0a0ab;
      line-height: 1.6;
    }

    .url-box {
      background-color: #151519;
      border: 1px solid #282832;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #f5a623;
      font-family: monospace;
      word-break: break-all;
      user-select: text;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      outline: none;
      transition: background-color 0.15s, opacity 0.15s;
    }

    .btn-safe {
      background-color: #4d7cff;
      color: #ffffff;
    }

    .btn-safe:hover {
      background-color: #3b6ae6;
    }

    .btn-insecure {
      background-color: #2b2b36;
      color: #e0e0ea;
      border: 1px solid #3d3d4b;
    }

    .btn-insecure:hover {
      background-color: #383847;
      color: #f5a623;
      border-color: #f5a623;
    }
  </style>
</head>
<body>
  <div class="warning-card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/>
      </svg>
    </div>

    <div>
      <h1>Aviso de Conexão Não Criptografada</h1>
      <p class="description">
        O Dragon tentou atualizar a conexão automaticamente para HTTPS criptografado, mas este site não parece suportar uma conexão segura. Informações enviadas ou recebidas poderão ser interceptadas em redes públicas ou locais.
      </p>
    </div>

    <div class="url-box" id="target-url">-</div>

    <div class="actions">
      <button class="btn-safe" id="btn-back">Voltar em segurança</button>
      <button class="btn-insecure" id="btn-continue-http">Continuar em HTTP (Inseguro)</button>
    </div>
  </div>

  <script src="https-warning.js"></script>
</body>
</html>
