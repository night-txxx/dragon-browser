<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Dragon - Falha no carregamento</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #18181d;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }

    .error-card {
      max-width: 540px;
      width: 100%;
      background-color: #202027;
      border: 1px solid #2e2e3a;
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background-color: rgba(224, 69, 69, 0.15);
      color: #e04545;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrapper svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f0f0f5;
      line-height: 1.3;
    }

    p.description {
      font-size: 14px;
      color: #a0a0ab;
      line-height: 1.5;
    }

    .details-box {
      background-color: #151519;
      border: 1px solid #282832;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      user-select: text;
    }

    .details-row {
      display: flex;
      gap: 8px;
      word-break: break-all;
    }

    .details-label {
      color: #727280;
      flex-shrink: 0;
      font-weight: 500;
    }

    .details-value {
      color: #c7c7d1;
      font-family: monospace;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      outline: none;
      transition: background-color 0.15s, opacity 0.15s;
    }

    .btn-primary {
      background-color: #4d7cff;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #3b6ae6;
    }

    .btn-secondary {
      background-color: #2b2b36;
      color: #d1d1db;
    }

    .btn-secondary:hover {
      background-color: #353542;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
    </div>

    <div>
      <h1>Não foi possível carregar a página</h1>
      <p class="description">Verifique sua conexão com a internet ou se o endereço digitado está correto.</p>
    </div>

    <div class="details-box">
      <div class="details-row">
        <span class="details-label">URL:</span>
        <span class="details-value" id="error-url">-</span>
      </div>
      <div class="details-row">
        <span class="details-label">Código:</span>
        <span class="details-value" id="error-code">-</span>
      </div>
      <div class="details-row">
        <span class="details-label">Detalhe:</span>
        <span class="details-value" id="error-desc">-</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="btn-retry">Tentar novamente</button>
      <button class="btn-secondary" id="btn-home">Página Inicial</button>
    </div>
  </div>

  <script src="error.js"></script>
</body>
</html>
