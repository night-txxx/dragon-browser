<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Favoritos - Dragon</title>
  <link rel="stylesheet" href="../src/renderer/styles/theme.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg-window, #1e1e24);
      color: var(--color-text-primary, #f0f0f5);
      font-family: var(--font-family-base, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
      font-size: var(--font-size-base, 13px);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    header {
      background-color: var(--color-bg-toolbar, #23232b);
      border-bottom: 1px solid var(--color-border-subtle, #2d2d38);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 0 5px rgba(41, 182, 255, 0.45));
      transition: filter 0.25s ease, transform 0.25s ease;
    }

    .header-logo:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 8px rgba(41, 182, 255, 0.75));
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 500px;
      justify-content: flex-end;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      max-width: 320px;
    }

    .search-input {
      width: 100%;
      background-color: var(--color-bg-input, #18181d);
      border: 1px solid var(--color-border-subtle, #2d2d38);
      border-radius: var(--radius-md, 6px);
      padding: 8px 12px 8px 32px;
      color: var(--color-text-primary, #f0f0f5);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--color-accent, #4d7cff);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      fill: var(--color-text-muted, #666673);
      pointer-events: none;
    }

    .btn-clear {
      background-color: rgba(255, 77, 77, 0.12);
      border: 1px solid rgba(255, 77, 77, 0.3);
      color: #ff6b6b;
      padding: 8px 14px;
      border-radius: var(--radius-md, 6px);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-clear:hover {
      background-color: rgba(255, 77, 77, 0.22);
    }

    main {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .bookmarks-card {
      background-color: var(--color-bg-toolbar, #23232b);
      border: 1px solid var(--color-border-subtle, #2d2d38);
      border-radius: var(--radius-lg, 8px);
      overflow: hidden;
    }

    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--color-border-subtle, #2d2d38);
      transition: background-color 0.15s;
    }

    .bookmark-item:last-child {
      border-bottom: none;
    }

    .bookmark-item:hover {
      background-color: var(--color-bg-button-hover, #333340);
    }

    .star-icon {
      width: 18px;
      height: 18px;
      fill: #ffb800;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .item-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-primary, #f0f0f5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-url {
      font-size: 12px;
      color: var(--color-text-secondary, #9e9ea8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-delete-item {
      background: transparent;
      border: none;
      color: var(--color-text-muted, #666673);
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      transition: opacity 0.15s, color 0.15s, background-color 0.15s;
    }

    .btn-delete-item:hover {
      opacity: 1;
      color: #ff6b6b;
      background-color: rgba(255, 77, 77, 0.1);
    }

    .btn-delete-item svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-text-muted, #666673);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      fill: currentColor;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="../assets/icons/favicon-circle.png" alt="Dragon" class="header-logo" />
      <h1 class="header-title">Favoritos</h1>
    </div>
    <div class="header-actions">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 16 16">
          <path d="M11.5 7a4.499 4.499 0 1 1-8.998 0A4.499 4.499 0 0 1 11.5 7zm-.82 4.74a6 6 0 1 0-1.06 1.06l3.65 3.65a.75.75 0 1 0 1.06-1.06l-3.65-3.65z"/>
        </svg>
        <input type="text" id="input-search" class="search-input" placeholder="Pesquisar nos favoritos..." />
      </div>
      <button id="btn-clear-all" class="btn-clear">Limpar Favoritos</button>
    </div>
  </header>

  <main>
    <div id="bookmarks-container" class="bookmarks-card">
      <div class="empty-state">
        <svg viewBox="0 0 16 16">
          <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
        </svg>
        <p>Nenhum favorito salvo ainda</p>
      </div>
    </div>
  </main>

  <script src="bookmarks.js"></script>
</body>
</html>
